; ============================================================
; Asterisk 20 — Queue Config for DialDesk Departments
; Server: 192.168.10.30
; ============================================================
; Strategy: rrmemory = round-robin with memory (picks up where it left off)
; timeout:  30s ring per agent before moving to next
; wrapuptime: 30s — agent cannot receive calls for 30s after hang-up
; autopause: yes — agent auto-paused if they miss a call
; ============================================================

[general]
; no global defaults needed

; ============================================================
; Reception
; ============================================================
[q-reception]
strategy=rrmemory
timeout=30
wrapuptime=30
autopause=yes
maxlen=10
announce-frequency=30
announce-holdtime=yes
periodic-announce=queue-periodic-announce
periodic-announce-frequency=60
; Add agents: member => PJSIP/XXXX,0,Agent Name
member => PJSIP/1001,0,Agent 1001

