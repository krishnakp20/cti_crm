; ============================================================
; Asterisk 20 — DialDesk Queues
; Server: 192.168.10.30
; Deploy: cp /tmp/queues.conf /etc/asterisk/queues.conf
;         asterisk -rx 'module reload app_queue.so'
; ============================================================

[general]
persistmembers = yes
autofill = yes
monitor-type = MixMonitor
monitor-format = wav

; ============================================================
; Press 1 — General Enquiries
;   Agent: Pankhuri (2001)
; ============================================================
[q-general]
strategy = ringall
timeout = 30
retry = 5
maxlen = 10
announce-frequency = 0
joinempty = yes
leavewhenempty = no
ringinuse = no
musicclass = default
member => PJSIP/2001

; ============================================================
; Press 2 — Sales & Marketing (Day: 09:00-18:00 Mon-Fri)
;   Agents: Sanjiv (2002) primary, Aman (2003) backup
; ============================================================
[q-sales-day]
