; ============================================================
; Add MixMonitor to each dept context BEFORE the Dial() line
; Apply on server by editing /etc/asterisk/extensions.conf
; ============================================================
;
; In each [dept-*] context, add this line BEFORE the first Dial():
;
;   same => n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}.wav,b)
;
; Example for [dept-general]:
;
; [dept-general]
; exten => s,1,NoOp(Dept: General Enquiries → Pankhuri 2001)
;  same => n,Set(CDR(department)=General Enquiries)
;  same => n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}.wav,b)
;  same => n,Dial(PJSIP/2001,30,rR)
;  ...
;
; Create recordings dir and set permissions:
;   mkdir -p /var/spool/asterisk/monitor
;   chown asterisk:asterisk /var/spool/asterisk/monitor
;
; Verify recording after a test call:
;   ls -la /var/spool/asterisk/monitor/
; ============================================================
