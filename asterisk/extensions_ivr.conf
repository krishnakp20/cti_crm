; ============================================================
; IVR Routing — Dynamic AGI-based (CTI CRM)
; Include this in /etc/asterisk/extensions.conf:
;   #include extensions_ivr.conf
;
; Asterisk variables to set before entering ivr-main:
;   Set(CLIENT_ID=1)          ; your client's DB id
;   Set(IVR_WELCOME_AUDIO=custom/welcome_en)  ; audio file (without extension)
; ============================================================

[ivr-main]
; Entry point — called from your DID/trunk context:
;   exten => _X.,1,Goto(ivr-main,s,1)

exten => s,1,NoOp(IVR Main — client ${CLIENT_ID})
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(ivr_router.py,${CLIENT_ID})
 same => n,Hangup()

; ============================================================
; Voicemail context for agents (add each agent's extension)
; Add boxes to /etc/asterisk/voicemail.conf under [default]:
;   <extension> => <pin>,<Agent Name>,<email@example.com>
; ============================================================
; Example voicemail.conf entries:
; [default]
; 2001 => 1234,Pankhuri,pankhuri@example.com
; 2002 => 1234,Sanjiv,sanjiv@example.com
; 2003 => 1234,Aman,aman@example.com
; 2004 => 1234,Rahul,rahul@example.com        ; press 4 → voicemail
; 2005 => 1234,Anvita,anvita@example.com
