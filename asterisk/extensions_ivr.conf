; ============================================================
; IVR Routing — Dynamic AGI-based (CTI CRM)
; Include this in /etc/asterisk/extensions.conf:
;   #include extensions_ivr.conf
;
; Flow:
;   1. ivr-greeting plays (language-neutral welcome)
;   2. lang-select prompt → caller presses 1=English / 2=Hindi
;   3. ivr-menu plays correct language department options
;   4. Department key press → AGI routes call
; ============================================================


; ── Entry point — called from your DID/trunk context ─────────────────────────
; Add to [from-vicidial] or your trunk context:
;
;   exten => 1001,1,NoOp(IVR entry — caller ${CALLERID(num)})
;    same => n,Set(CHANNEL(language)=en)
;    same => n,Set(IVR_ATTEMPT=0)
;    same => n,Answer()
;    same => n,Wait(1)
;    same => n,Goto(ivr-main,s,1)


; ── Step 1 + 2: Greeting then language selection ──────────────────────────────
[ivr-main]

exten => s,1,NoOp(IVR Start)
 same => n,Playback(custom/ivr-greeting)        ; Company welcome — same for all
 same => n,Background(custom/lang-select)       ; "Press 1 English, 2 Hindi"
 same => n,WaitExten(5)

exten => 1,1,Set(CHANNEL(language)=en)
 same => n,Goto(ivr-menu,s,1)

exten => 2,1,Set(CHANNEL(language)=hi)
 same => n,Goto(ivr-menu,s,1)

exten => i,1,Goto(s,1)                          ; Invalid key — replay from greeting
exten => t,1,Set(CHANNEL(language)=en)
 same => n,Goto(ivr-menu,s,1)                   ; Timeout — default English


; ── Step 3: Department menu (language-aware) ──────────────────────────────────
[ivr-menu]

exten => s,1,NoOp(IVR Menu — lang=${CHANNEL(language)})
 same => n,GotoIf($["${CHANNEL(language)}" = "hi"]?play_hi)
 same => n,Background(custom/ivr-welcome)       ; English department options
 same => n,WaitExten(5)
 same => n,Goto(s,1)
 same => n(play_hi),Background(custom/ivr-welcome-hi)  ; Hindi department options
 same => n,WaitExten(5)
 same => n,Goto(s,1)

; Department key presses — AGI reads routing from CTI DB
exten => 1,1,AGI(ivr_router.py,6,1)
 same => n,Hangup()
exten => 2,1,AGI(ivr_router.py,6,2)
 same => n,Hangup()
exten => 3,1,AGI(ivr_router.py,6,3)
 same => n,Hangup()
exten => 4,1,AGI(ivr_router.py,6,4)
 same => n,Hangup()
exten => 5,1,AGI(ivr_router.py,6,5)
 same => n,Hangup()
exten => 0,1,AGI(ivr_router.py,6,0)
 same => n,Hangup()

exten => i,1,Goto(s,1)                          ; Invalid key — replay menu
exten => t,1,Goto(s,1)                          ; Timeout — replay menu


; ============================================================
; Audio files required in /var/lib/asterisk/sounds/custom/
;
;   ivr-greeting      — Language-neutral company welcome
;   lang-select       — "Press 1 for English. Hindi ke liye 2 dabayein."
;   ivr-welcome       — English department menu options
;   ivr-welcome-hi    — Hindi department menu options
;
; Convert audio to Asterisk format (8kHz, mono, slin):
;   sox input.mp3 -r 8000 -c 1 -e signed-integer output.slin
; ============================================================


