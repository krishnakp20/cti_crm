; ============================================================
; PJSIP Agent Extensions for DialDesk WebRTC
; Merge into /etc/asterisk/pjsip.conf (keep your transport/cert sections)
; Agents: 2001 Pankhuri | 2002 Sanjiv | 2003 Aman | 2004 Rahul | 2005 Anvita
; ============================================================

; ---- Shared WebRTC template ----
[webrtc-agent](!)
type=endpoint
context=from-vicidial
disallow=all
allow=opus
allow=ulaw
allow=alaw
transport=transport-wss
use_avpf=yes
media_encryption=dtls
dtls_verify=no
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
direct_media=no
force_rport=yes
rewrite_contact=yes

[webrtc-aor](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

[webrtc-auth](!)
type=auth
auth_type=userpass

; ============================================================
; 2001 — Pankhuri   (Press 1 General, Press 0 Operator)
; ============================================================
[2001](webrtc-agent)
auth=auth2001
aors=2001

[auth2001](webrtc-auth)
username=2001
password=Pankhuri@2001

[2001](webrtc-aor)

; ============================================================
; 2002 — Sanjiv   (Press 2 Sales day, Press 3 Support day)
; ============================================================
[2002](webrtc-agent)
auth=auth2002
aors=2002

[auth2002](webrtc-auth)
username=2002
password=Sanjiv@2002

[2002](webrtc-aor)

; ============================================================
; 2003 — Aman   (Press 2 Sales backup/evening, Press 3 Support backup/evening)
