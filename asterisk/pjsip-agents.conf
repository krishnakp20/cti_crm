[2005](webrtc-agent)
auth=auth2005
aors=2005

[auth2005](webrtc-auth)
username=2005
password=Anvita@2005

[2005](webrtc-aor)

; ============================================================
; ViciDial SIP trunk (keep existing)
; ============================================================
[transport-udp-vicidial]
type=transport
protocol=udp
bind=0.0.0.0:5081

[vicidial-trunk]
type=endpoint
context=from-vicidial
disallow=all
allow=ulaw
aors=vicidial-aor
direct_media=no

[vicidial-aor]
type=aor
contact=sip:192.168.10.8:5060

[vicidial-identify]
type=identify
endpoint=vicidial-trunk
match=192.168.10.8
