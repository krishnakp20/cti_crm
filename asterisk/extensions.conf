; ============================================================
; Asterisk 20 — DialDesk IVR Dialplan
; Server:  192.168.10.30
; ViciDial: Dial(SIP/1001@192.168.10.30:5080)  ← IVR entry
; Agents:  2001 Pankhuri | 2002 Sanjiv | 2003 Aman | 2004 Rahul | 2005 Anvita
; ============================================================

; ============================================================
; Calls arriving from ViciDial (192.168.10.8)
; ============================================================
[from-vicidial]

; 1001 = IVR entry — ViciDial dials Dial(SIP/1001@192.168.10.30:5080)
exten => 1001,1,NoOp(IVR entry — caller ${CALLERID(num)})
 same => n,Set(CHANNEL(language)=en)
 same => n,Set(IVR_ATTEMPT=0)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(ivr-main,s,1)

; Direct agent bypass (for testing)
exten => 2001,1,Dial(PJSIP/2001,30)
 same => n,Hangup()
exten => 2002,1,Dial(PJSIP/2002,30)
 same => n,Hangup()
exten => 2003,1,Dial(PJSIP/2003,30)
 same => n,Hangup()
exten => 2004,1,Dial(PJSIP/2004,30)
 same => n,Hangup()
exten => 2005,1,Dial(PJSIP/2005,30)
 same => n,Hangup()

; ============================================================
; IVR Main Menu
; ============================================================
[ivr-main]
exten => s,1,NoOp(IVR Menu — attempt ${IVR_ATTEMPT})
 same => n,Playback(custom/ivr-greeting)
 same => n,Background(custom/ivr-welcome)
 same => n,WaitExten(5)

; --- Department selections ---
exten => 1,1,Goto(dept-general,s,1)
exten => 2,1,Goto(dept-sales,s,1)
exten => 3,1,Goto(dept-support,s,1)
exten => 4,1,Goto(dept-accounts,s,1)
exten => 5,1,Goto(dept-hr,s,1)
exten => 0,1,Goto(dept-operator,s,1)
exten => *,1,Goto(ivr-main,s,1)    ; * = repeat menu

; --- Invalid input ---
exten => i,1,Playback(custom/ivr-invalid)
 same => n,Set(IVR_ATTEMPT=$[${IVR_ATTEMPT} + 1])
 same => n,GotoIf($[${IVR_ATTEMPT} >= 3]?dept-operator,s,1)
 same => n,Goto(ivr-main,s,1)

; --- No input ---
exten => t,1,Playback(custom/ivr-noinput)
 same => n,Set(IVR_ATTEMPT=$[${IVR_ATTEMPT} + 1])
 same => n,GotoIf($[${IVR_ATTEMPT} >= 3]?dept-operator,s,1)
 same => n,Goto(ivr-main,s,1)

; ============================================================
; Press 1 — General Enquiries → q-general (Pankhuri 2001)
;   Caller waits in queue up to 60s, then plays unavailable
; ============================================================
[dept-general]
exten => s,1,NoOp(Dept: General Enquiries — q-general)
 same => n,Set(CDR(department)=General Enquiries)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}.wav,b)
 same => n,Queue(q-general,,,,,60)
 same => n,Playback(vm-nobodyavail)
exten => s,n(done),Hangup()

; ============================================================
; Press 2 — Sales & Marketing
;   Day (09:00-18:00 Mon-Fri): q-sales-day (Sanjiv→Aman)
;   Evening: q-sales-eve (Aman)
;   Timeout → unavailable message
; ============================================================
[dept-sales]
exten => s,1,NoOp(Dept: Sales & Marketing)
 same => n,Set(CDR(department)=Sales & Marketing)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}.wav,b)
 same => n,GotoIfTime(9:00-18:00|mon-fri|*|*?daytime)
 same => n,Goto(evening)

exten => s,n(daytime),NoOp(Sales daytime — q-sales-day)
 same => n,Queue(q-sales-day,,,,,60)
 same => n,Goto(noanswer)

exten => s,n(evening),NoOp(Sales evening — q-sales-eve)
 same => n,Queue(q-sales-eve,,,,,60)
 same => n,Goto(noanswer)

exten => s,n(noanswer),Playback(vm-nobodyavail)
exten => s,n(done),Hangup()

; ============================================================
; Press 3 — Customer Service
;   Day: q-support-day (Sanjiv→Aman)
