; ============================================================
; Asterisk 20 — DialDesk IVR Dialplan
; Server:  192.168.10.30
; ViciDial: Dial(SIP/1001@192.168.10.30:5080)  ← IVR entry
; Agents:  2001 Pankhuri | 2002 Sanjiv | 2003 Aman | 2004 Rahul | 2005 Anvita
; ============================================================

; ============================================================
; Calls arriving from ViciDial (192.168.10.8)
; ============================================================
[from-vicidial]

; 1001 = IVR entry — ViciDial dials Dial(SIP/1001@192.168.10.30:5080)
exten => 1001,1,NoOp(IVR entry — caller ${CALLERID(num)})
 same => n,Set(CHANNEL(language)=en)
 same => n,Set(IVR_ATTEMPT=0)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(ivr-main,s,1)

; Direct agent bypass (for testing)
exten => 2001,1,Dial(PJSIP/2001,30)
 same => n,Hangup()
exten => 2002,1,Dial(PJSIP/2002,30)
 same => n,Hangup()
exten => 2003,1,Dial(PJSIP/2003,30)
 same => n,Hangup()
exten => 2004,1,Dial(PJSIP/2004,30)
 same => n,Hangup()
exten => 2005,1,Dial(PJSIP/2005,30)
 same => n,Hangup()

; ============================================================
; IVR Main Menu
; Upload prompt to: /var/lib/asterisk/sounds/custom/ivr-welcome.wav
; Text: "Thank you for calling. Press 1 for General Enquiries,
;        2 for Sales and Marketing, 3 for Customer Service,
;        4 for Accounts and Finance, 5 for HR,
;        0 to speak with an Operator, or star to repeat this menu."
; ============================================================
[ivr-main]
exten => s,1,NoOp(IVR Menu — attempt ${IVR_ATTEMPT})
 same => n,Background(custom/ivr-welcome)
 same => n,WaitExten(5)

; --- Department selections ---
exten => 1,1,Goto(dept-general,s,1)
exten => 2,1,Goto(dept-sales,s,1)
exten => 3,1,Goto(dept-support,s,1)
exten => 4,1,Goto(dept-accounts,s,1)
exten => 5,1,Goto(dept-hr,s,1)
exten => 0,1,Goto(dept-operator,s,1)
exten => *,1,Goto(ivr-main,s,1)    ; * = repeat menu

; --- Invalid input (plays prompt, retry up to 3 times, then operator) ---
; Upload: /var/lib/asterisk/sounds/custom/ivr-invalid.wav
; Text: "Sorry, that is not a valid option. Please select from the available options."
exten => i,1,Playback(custom/ivr-invalid)
 same => n,Set(IVR_ATTEMPT=$[${IVR_ATTEMPT} + 1])
 same => n,GotoIf($[${IVR_ATTEMPT} >= 3]?dept-operator,s,1)
 same => n,Goto(ivr-main,s,1)

; --- No input (plays prompt, retry up to 3 times, then operator) ---
; Upload: /var/lib/asterisk/sounds/custom/ivr-noinput.wav
; Text: "We did not receive any input. Please select an option to continue."
exten => t,1,Playback(custom/ivr-noinput)
 same => n,Set(IVR_ATTEMPT=$[${IVR_ATTEMPT} + 1])
 same => n,GotoIf($[${IVR_ATTEMPT} >= 3]?dept-operator,s,1)
 same => n,Goto(ivr-main,s,1)

; ============================================================
; Press 1 — General Enquiries
;   Primary:  Pankhuri (2001)
;   Fallback: unavailable message
; ============================================================
[dept-general]
exten => s,1,NoOp(Dept: General Enquiries → Pankhuri 2001)
 same => n,Set(CDR(department)=General Enquiries)
 same => n,Dial(PJSIP/2001,30,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(vm-nobodyavail)
exten => s,n(done),Hangup()

; ============================================================
; Press 2 — Sales & Marketing
;   Day (09:00-18:00 Mon-Fri): Sanjiv (2002) → Aman (2003) → Voicemail
;   Evening:                   Aman (2003) → Voicemail
; ============================================================
[dept-sales]
exten => s,1,NoOp(Dept: Sales & Marketing)
 same => n,Set(CDR(department)=Sales)
 same => n,GotoIfTime(9:00-18:00|mon-fri|*|*?daytime)
 same => n,Goto(evening)

exten => s,n(daytime),NoOp(Sales daytime — Sanjiv primary)
 same => n,Dial(PJSIP/2002,25,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,NoOp(Sanjiv unavailable — trying Aman)
 same => n,Dial(PJSIP/2003,25,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Goto(voicemail)

exten => s,n(evening),NoOp(Sales evening — Aman primary)
 same => n,Dial(PJSIP/2003,30,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Goto(voicemail)

exten => s,n(voicemail),VoiceMail(2002@default,u)
exten => s,n(done),Hangup()

; ============================================================
; Press 3 — Customer Service
;   Day: Sanjiv (2002) → Aman (2003) → unavailable
;   Evening: Aman (2003) → unavailable
; ============================================================
[dept-support]
exten => s,1,NoOp(Dept: Customer Service)
 same => n,Set(CDR(department)=Customer Service)
 same => n,GotoIfTime(9:00-18:00|mon-fri|*|*?daytime)
 same => n,Goto(evening)

exten => s,n(daytime),Dial(PJSIP/2002,25,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Dial(PJSIP/2003,25,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Goto(noanswer)

exten => s,n(evening),Dial(PJSIP/2003,30,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Goto(noanswer)

exten => s,n(noanswer),Playback(vm-nobodyavail)
exten => s,n(done),Hangup()

; ============================================================
; Press 4 — Accounts & Finance
;   Primary:  Rahul (2004)
;   Fallback: Voicemail (box 2004)
; ============================================================
[dept-accounts]
exten => s,1,NoOp(Dept: Accounts → Rahul 2004)
 same => n,Set(CDR(department)=Accounts)
 same => n,Dial(PJSIP/2004,30,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,VoiceMail(2004@default,u)
exten => s,n(done),Hangup()

; ============================================================
; Press 5 — HR
;   Primary:  Anvita (2005)
;   Fallback: unavailable message
; ============================================================
[dept-hr]
exten => s,1,NoOp(Dept: HR → Anvita 2005)
 same => n,Set(CDR(department)=HR)
 same => n,Dial(PJSIP/2005,30,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(vm-nobodyavail)
exten => s,n(done),Hangup()

; ============================================================
; Press 0 — Operator
;   Primary:  Pankhuri (2001)
;   Backup:   Anvita (2005)
;   Fallback: unavailable message
; ============================================================
[dept-operator]
exten => s,1,NoOp(Dept: Operator → Pankhuri 2001 / Anvita 2005)
 same => n,Set(CDR(department)=Operator)
 same => n,Dial(PJSIP/2001,25,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,NoOp(Pankhuri unavailable — trying Anvita)
 same => n,Dial(PJSIP/2005,25,rR)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(vm-nobodyavail)
exten => s,n(done),Hangup()
