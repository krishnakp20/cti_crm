; ============================================================
; Shared defaults for every DialDesk queue.
; Included from /etc/asterisk/queues.conf by apply-queue-defaults.sh.
;
; To add a queue for any client, only list what is different:
;
;   [q-clientname-sales](dialdesk-queue)
;   member => PJSIP/3001
;   member => PJSIP/3002
;
; A setting written inside a queue overrides the value below.
; ============================================================
[dialdesk-queue](!)
strategy=leastrecent
ringinuse=no
timeout=30
wrapuptime=5
retry=5
musicclass=default
