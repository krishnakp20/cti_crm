; ============================================================
; Shared default for every DialDesk queue: never ring an agent
; who is already on a call.
; Included from /etc/asterisk/queues.conf by apply-queue-defaults.sh.
;
; Only this one behaviour is inherited. Each queue still sets its own
; strategy, timeout, wrapuptime and members, so existing queues keep
; working exactly as they do today.
;
; To add a queue for any client:
;
;   [q-clientname-sales](dialdesk-queue)
;   strategy=leastrecent
;   timeout=30
;   wrapuptime=5
;   member => PJSIP/3001
;   member => PJSIP/3002
; ============================================================
[dialdesk-queue](!)
ringinuse=no
